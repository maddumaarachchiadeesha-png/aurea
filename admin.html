<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Aurea Admin</title>
<style>
:root{--g:#18543A;--ink:#0F2A1E;--line:#E1E9E3;--mute:#58695F}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#F4F7F5;color:var(--ink)}
.w{max-width:980px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:22px 0 10px}
.top{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}.top .w{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h1{margin-right:auto}
button,.up{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:600 15px system-ui;cursor:pointer;display:inline-block;margin:0}
.o{background:#fff;color:var(--ink);border:1px solid #bcc9c0}.d{background:#9b2c2c}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--mute)}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #bcc9c0;border-radius:8px;font:inherit;margin-top:2px}
input[type=file]{display:none}
.pr{display:grid;grid-template-columns:120px 1fr;gap:14px}@media(max-width:600px){.pr{grid-template-columns:1fr}}
.th{width:120px;height:120px;border-radius:10px;background:#EEF4F0;display:grid;place-items:center;color:var(--mute);font-size:12px;margin-bottom:6px;overflow:hidden}.th img{width:100%;height:100%;object-fit:cover}
.wide{width:100%;max-width:300px;height:110px}
.note{background:#FFF8D6;border:1px solid #e6d680;border-radius:10px;padding:10px 14px;font-size:14px}
</style></head><body>
<div class="top"><div class="w"><h1>Aurea Admin</h1><button class="o" id="rs">Reset draft</button><button id="dl">Download data.js</button></div></div>
<div class="w"><p class="note"><b>How it works:</b> your changes are saved as a draft in this browser only. When you are done, tap <b>Download data.js</b> and upload it to your website host, replacing the old <b>data.js</b>. Customers see the change after that. If you later change data.js by hand, tap <b>Reset draft</b> first.</p><div id="app"></div></div>
<script src="data.js"></script>
<script>
var K="aurea_admin_draft",D,CATS=["Cleanse","Treat","Hydrate","Protect"],$=function(i){return document.getElementById(i)};
try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||JSON.parse(JSON.stringify(window.AUREA));
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert("Draft is too big to keep in the browser. Tap Download data.js now so you do not lose it.")}}
function shrink(f,max,type,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);var x=c.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(type,.82))};i.src=r.result};r.readAsDataURL(f)}
function up(id,k,i){return'<label class="up o">Upload photo<input type="file" accept="image/*" data-up="'+k+'"'+(i==null?"":' data-i="'+i+'"')+'></label> '+(id?'<button class="o" data-rm="'+k+'"'+(i==null?"":' data-i="'+i+'"')+'>Remove</button>':"")}
function draw(){
var h='<h2>Site settings</h2><div class="box"><div class="g"><label>WhatsApp number<input data-s="wa" value="'+esc(D.wa)+'"></label><label>Delivery charge (Rs.)<input type="number" min="0" data-s="delivery" value="'+esc(D.delivery)+'"></label></div>'+
'<div class="g"><div><label>Banner image (top of home page)</label><div class="th wide">'+(D.hero?'<img src="'+D.hero+'">':"None")+'</div>'+up(D.hero,"hero")+'</div><div><label>Logo image (replaces the Aurea text)</label><div class="th wide">'+(D.logo?'<img src="'+D.logo+'" style="object-fit:contain">':"None")+'</div>'+up(D.logo,"logo")+'</div></div></div>'+
'<h2>Products ('+D.products.length+')</h2>';
D.products.forEach(function(p,i){h+='<div class="box pr"><div><div class="th">'+(p.img?'<img src="'+p.img+'">':"No photo")+'</div>'+up(p.img,"p",i)+'</div><div><div class="g">'+
'<label>Name<input data-i="'+i+'" data-k="n" value="'+esc(p.n)+'"></label>'+
'<label>Category<select data-i="'+i+'" data-k="c">'+CATS.map(function(c){return"<option"+(c===p.c?" selected":"")+">"+c+"</option>"}).join("")+'</select></label>'+
'<label>Price (Rs.)<input type="number" min="0" data-i="'+i+'" data-k="price" value="'+esc(p.price)+'"></label>'+
'<label>Stock<input type="number" min="0" data-i="'+i+'" data-k="stock" value="'+esc(p.stock)+'"></label>'+
'<label>Size<input data-i="'+i+'" data-k="size" value="'+esc(p.size)+'"></label>'+
'<label>Skin types (comma, or "All")<input data-i="'+i+'" data-k="skin" value="'+esc(p.skin.join(", "))+'"></label></div>'+
'<label>Description<textarea rows="2" data-i="'+i+'" data-k="d">'+esc(p.d)+'</textarea></label><p style="margin:10px 0 0"><button class="d" data-del="'+i+'">Delete product</button></p></div></div>'});
$("app").innerHTML=h+'<button id="add">+ Add product</button>'}
document.addEventListener("change",function(e){var t=e.target,d=t.dataset,v=t.value;
if(d.s){if(d.s==="wa"){v=v.replace(/\D/g,"");if(v[0]==="0")v="94"+v.slice(1);t.value=v}else v=Math.max(0,+v||0);D[d.s]=v;save()}
else if(d.k){var p=D.products[d.i];if(d.k==="price"||d.k==="stock")v=Math.max(0,+v||0);if(d.k==="skin"){v=v.split(",").map(function(x){return x.trim()}).filter(Boolean);if(!v.length)v=["All"]}p[d.k]=v;save()}
else if(d.up&&t.files[0]){var big=d.up==="hero"?1600:d.up==="logo"?400:700;shrink(t.files[0],big,d.up==="logo"?"image/png":"image/jpeg",function(u){if(d.up==="p")D.products[d.i].img=u;else D[d.up]=u;save();draw()})}});
document.addEventListener("click",function(e){var d=e.target.dataset;
if(d.rm!=null){if(d.rm==="p")delete D.products[d.i].img;else D[d.rm]="";save();draw()}
if(d.del!=null&&confirm("Delete "+D.products[d.del].n+"?")){D.products.splice(d.del,1);save();draw()}
if(e.target.id==="add"){D.products.push({id:"p"+Date.now(),n:"New product",c:"Hydrate",t:"bottle",l:"NEW",price:3000,stock:10,size:"50 ml",skin:["All"],when:"Morning and night",d:"Describe this product.",ing:[],ben:[],use:"",tip:""});save();draw();window.scrollTo(0,document.body.scrollHeight)}
if(e.target.id==="rs"&&confirm("Discard the draft and reload from data.js?")){localStorage.removeItem(K);location.reload()}
if(e.target.id==="dl"){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["window.AUREA="+JSON.stringify(D,null,1)+";\n"],{type:"text/javascript"}));a.download="data.js";a.click()}});
draw();
</script></body></html>
